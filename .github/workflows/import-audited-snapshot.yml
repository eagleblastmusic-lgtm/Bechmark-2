name: Import exact audited snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize audited source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bdb-source
          git clone --quiet https://github.com/eagleblastmusic-lgtm/BDB_AUDIT_CZAT.git /tmp/bdb-source
          git -C /tmp/bdb-source checkout --quiet --detach 52e60e900c5ffa3910b4909f46c612584befcc92
          rsync -a --delete --exclude='.git' /tmp/bdb-source/ ./
          rm -f .benchmark-init

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          source_tree=$(git -C /tmp/bdb-source rev-parse HEAD^{tree})
          expected_tree=b9fbc72c5f38abe16f32c92293700c71aa3e9cec
          test "$source_tree" = "$expected_tree"

      - name: Commit exact benchmark snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: exact audited snapshot 52e60e900c5ffa3910b4909f46c612584befcc92"
          copied_tree=$(git rev-parse HEAD^{tree})
          expected_tree=b9fbc72c5f38abe16f32c92293700c71aa3e9cec
          test "$copied_tree" = "$expected_tree"
          git push origin HEAD:main
